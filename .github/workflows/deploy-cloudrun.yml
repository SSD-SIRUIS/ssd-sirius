# Déploiement sur Google Cloud Run.
# Déclenchement : automatique à chaque push sur `main`, ou à la main depuis
# l'onglet Actions → "Deploy to Cloud Run" → Run workflow.
#
# Secrets à définir (Settings → Secrets and variables → Actions) :
#   GCP_PROJECT_ID           ex. ssd-sirius-prod
#   GCP_REGION               ex. europe-west1
#   GCP_SA_KEY               clé JSON d'un compte de service (roles: Cloud Run Admin,
#                            Service Account User, Artifact Registry Writer, Cloud Build Editor)
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   NEXT_PUBLIC_SITE_URL     ex. https://ssd-sirius.com

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois : un nouveau push annule celui en cours.
concurrency:
  group: deploy-cloudrun
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: |
          gcloud run deploy ssd-sirius \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ secrets.GCP_REGION }}" \
            --port 8080 \
            --allow-unauthenticated \
            --set-env-vars "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }},NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }},SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }},NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}"
