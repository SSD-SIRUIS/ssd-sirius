# Déploiement sur Google Cloud Run.
# Déclenchement : automatique à chaque push sur `main`, ou à la main depuis
# l'onglet Actions → "Deploy to Cloud Run" → Run workflow.
#
# Secrets à définir (Settings → Secrets and variables → Actions) :
#   GCP_PROJECT_ID           sacred-epigram-507517-c3
#   GCP_REGION               europe-west1
#   GCP_SA_KEY               clé JSON du compte de service github-deploy (rôles : Cloud Run
#                            Admin, Service Account User, Cloud Build Editor, Artifact
#                            Registry Writer, Storage Admin, Service Usage Consumer)
#   NEXT_PUBLIC_SUPABASE_URL https://kbvyzihoegjkwvuvtppp.supabase.co (base de l'entreprise)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   NEXT_PUBLIC_SITE_URL     https://sirius-mali.tech

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois : un nouveau push annule celui en cours.
concurrency:
  group: deploy-cloudrun
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Arrêt immédiat si un secret manque : sans ce contrôle, une valeur vide
      # serait poussée telle quelle sur le service en production.
      - name: Vérification des secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          missing=""
          for name in GCP_SA_KEY GCP_PROJECT_ID GCP_REGION NEXT_PUBLIC_SUPABASE_URL \
                      NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SITE_URL; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # --update-env-vars (et non --set-env-vars) : seules ces variables sont
      # écrites, celles ajoutées à la main sur le service sont conservées.
      - name: Deploy
        run: |
          gcloud run deploy ssd-sirius \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ secrets.GCP_REGION }}" \
            --port 8080 \
            --allow-unauthenticated \
            --update-env-vars "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }},NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }},SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }},NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}"
